<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
</head>
<body>
    <h1>Contato</h1>
    <a href="index.html">Principal</a>

    <br><br>
    <form action="">
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" 
        placeholder="Digite seu nome" required>
        
        <br><br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email"
        placeholder="Digite se email" required>

        <br><br>
        <label for="telefone">Telefone:</label>
        <input type="number" name="telefone" id="telefone"
        placeholder="Digite seu Telefone">

        <br>
        <p>Produto</p>
        <input type="radio" name="Produto" id="Camisa">
        <label for="Camisa">Camisa</label>
        <input type="radio" name="Produto" id="Calça">
        <label for="Calça">Calça</label>

        <br><br>
        <label for="data">Data para Atendimento</label>
        <input type="date" name="data" id="data" 
        placeholder="Escolha a Data para o Atendimento">

        <br><br>
        <label for="mensagem">Mensagem:</label>
        <input type="text" name="mensagem" id="mensagem"
        placeholder="Escreva sua Mensagem" required>

        <br><br>
        <label for="Checkbox">Aceite os Termos</label>
        <input type="checkbox" name="checkbox" id="checkbox">

        <br><br>
        <button type="submit">Enviar</button>
        <br><br>
        <button type="reset">Limpar</button>

        

    </form>
    
</body>
</html>
